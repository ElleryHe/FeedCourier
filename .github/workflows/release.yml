name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish Docker Hub images, Git tag, and GitHub Release (leave false for dry-run binary build)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect Release Version
    runs-on: ubuntu-24.04
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      should_publish: ${{ steps.detect.outputs.should_publish }}
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      needs_tag_push: ${{ steps.detect.outputs.needs_tag_push }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve planned version and tag state
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_FULL: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_PUBLISH: ${{ inputs.publish == true && 'true' || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ ! "${CARGO_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid semantic version '${CARGO_VERSION}' in Cargo.toml"
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "push" && "${REF_FULL}" == refs/tags/v* ]]; then
            TAG_VERSION="${REF_NAME#v}"
            if [[ "${CARGO_VERSION}" != "${TAG_VERSION}" ]]; then
              echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match git tag (${REF_NAME})"
              exit 1
            fi
            TAG="v${CARGO_VERSION}"
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "GitHub Release ${TAG} already exists; skipping duplicate tag run."
              SHOULD_BUILD="false"
              SHOULD_PUBLISH="false"
            else
              SHOULD_BUILD="true"
              SHOULD_PUBLISH="true"
            fi
            NEEDS_TAG_PUSH="false"
          elif [[ "${EVENT_NAME}" == "push" && "${REF_FULL}" == "refs/heads/main" ]]; then
            TAG="v${CARGO_VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists on origin; skipping release pipeline for non-version-bump commit on main."
              SHOULD_BUILD="false"
              SHOULD_PUBLISH="false"
              NEEDS_TAG_PUSH="false"
            else
              echo "Detected new planned version ${CARGO_VERSION} on main (tag ${TAG} not yet created); starting automated release."
              if [[ -f CHANGELOG.md ]] && ! grep -Eq "^## \[${CARGO_VERSION//./\\.}\]" CHANGELOG.md; then
                echo "::warning::CHANGELOG.md does not contain a '## [${CARGO_VERSION}]' heading; GitHub Release will rely on auto-generated notes."
              fi
              SHOULD_BUILD="true"
              SHOULD_PUBLISH="true"
              NEEDS_TAG_PUSH="true"
            fi
          else
            # workflow_dispatch
            TAG="v${CARGO_VERSION}"
            SHOULD_BUILD="true"
            if [[ "${DISPATCH_PUBLISH}" == "true" ]]; then
              if gh release view "${TAG}" >/dev/null 2>&1; then
                echo "::error::GitHub Release ${TAG} already exists; bump Cargo.toml before publishing."
                exit 1
              fi
              SHOULD_PUBLISH="true"
              if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
                NEEDS_TAG_PUSH="false"
              else
                NEEDS_TAG_PUSH="true"
              fi
            else
              SHOULD_PUBLISH="false"
              NEEDS_TAG_PUSH="false"
            fi
          fi

          {
            echo "version=${CARGO_VERSION}"
            echo "tag=${TAG}"
            echo "should_build=${SHOULD_BUILD}"
            echo "should_publish=${SHOULD_PUBLISH}"
            echo "needs_tag_push=${NEEDS_TAG_PUSH}"
          } >> "$GITHUB_OUTPUT"

  web-dist:
    name: Build Embedded WebUI Bundle
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --dir web exec tsc --noEmit

      - name: Build production WebUI bundle
        run: pnpm --dir web build

      - name: Upload compiled WebUI dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  binaries:
    name: Release Binary (${{ matrix.target }})
    needs:
      - prepare
      - web-dist
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake pkg-config

      - name: Download compiled WebUI dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build locked release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${TARGET}"

      - name: Strip and package release archive
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          BIN_PATH="target/${TARGET}/release/feedcourier"
          strip "${BIN_PATH}"

          STAGE_DIR="$(mktemp -d)"
          cp "${BIN_PATH}" "${STAGE_DIR}/feedcourier"
          chmod 0755 "${STAGE_DIR}/feedcourier"
          cp LICENSE README.md README.zh-CN.md "${STAGE_DIR}/"

          ARCHIVE="feedcourier-${VERSION}-${TARGET}.tar.gz"
          tar -czf "${ARCHIVE}" -C "${STAGE_DIR}" feedcourier LICENSE README.md README.zh-CN.md
          rm -rf "${STAGE_DIR}"

      - name: Upload binary archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: feedcourier-${{ needs.prepare.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  binaries-macos:
    name: Release Binaries (macOS arm64 & x86_64)
    needs:
      - prepare
      - web-dist
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download compiled WebUI dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: apple-darwin

      - name: Build, strip, and package macOS release archives
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin; do
            if [[ "${TARGET}" == "aarch64-apple-darwin" ]]; then
              export CMAKE_OSX_ARCHITECTURES="arm64"
            else
              export CMAKE_OSX_ARCHITECTURES="x86_64"
            fi

            cargo build --release --locked --target "${TARGET}"

            BIN_PATH="target/${TARGET}/release/feedcourier"
            strip -x "${BIN_PATH}"

            STAGE_DIR="$(mktemp -d)"
            cp "${BIN_PATH}" "${STAGE_DIR}/feedcourier"
            chmod 0755 "${STAGE_DIR}/feedcourier"
            cp LICENSE README.md README.zh-CN.md "${STAGE_DIR}/"

            ARCHIVE="feedcourier-${VERSION}-${TARGET}.tar.gz"
            tar -czf "${ARCHIVE}" -C "${STAGE_DIR}" feedcourier LICENSE README.md README.zh-CN.md
            rm -rf "${STAGE_DIR}"
          done

      - name: Upload macOS arm64 binary archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-aarch64-apple-darwin
          path: feedcourier-${{ needs.prepare.outputs.version }}-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

      - name: Upload macOS x86_64 binary archive artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-x86_64-apple-darwin
          path: feedcourier-${{ needs.prepare.outputs.version }}-x86_64-apple-darwin.tar.gz
          if-no-files-found: error

  docker-build:
    name: Container Image (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs:
      - prepare
      - web-dist
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            os: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve target container image repository
        id: registries
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO_OVERRIDE: ${{ vars.DOCKERHUB_REPO }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" ]] || [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets must be configured to publish Docker Hub images."
            exit 1
          fi
          RAW_DH_IMAGE="${DOCKERHUB_REPO_OVERRIDE:-${DOCKERHUB_USERNAME}/feedcourier}"
          DH_IMAGE="$(printf '%s' "${RAW_DH_IMAGE}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${DH_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract OCI labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registries.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }},enable=${{ !startsWith(needs.prepare.outputs.tag, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.tag, '-') }}

      - name: Build and push native platform image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.registries.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Export pushed image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DIGEST}" ]]; then
            echo "::error::Missing image digest output from docker/build-push-action"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload platform digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Multi-Arch Container Manifest (Docker Hub)
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - docker-build
    if: needs.prepare.outputs.should_publish == 'true'
    steps:
      - name: Download platform digest artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve target container image repository
        id: registries
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO_OVERRIDE: ${{ vars.DOCKERHUB_REPO }}
        run: |
          set -euo pipefail
          RAW_DH_IMAGE="${DOCKERHUB_REPO_OVERRIDE:-${DOCKERHUB_USERNAME}/feedcourier}"
          DH_IMAGE="$(printf '%s' "${RAW_DH_IMAGE}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${DH_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract semantic version tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.registries.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }},enable=${{ !startsWith(needs.prepare.outputs.tag, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.tag, '-') }}

      - name: Merge and publish multi-arch manifest list
        env:
          IMAGE: ${{ steps.registries.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          DIGEST_FILES=("${RUNNER_TEMP}/digests"/*)
          if [[ "${#DIGEST_FILES[@]}" -ne 2 ]]; then
            echo "::error::Expected 2 platform digests (amd64 & arm64), found ${#DIGEST_FILES[@]}"
            exit 1
          fi

          ARGS=()
          while IFS= read -r tag; do
            [[ -n "${tag}" ]] && ARGS+=(--tag "${tag}")
          done <<< "${TAGS}"

          for file in "${DIGEST_FILES[@]}"; do
            ARGS+=("${IMAGE}@sha256:$(basename "${file}")")
          done

          docker buildx imagetools create "${ARGS[@]}"

          PRIMARY_TAG="$(printf '%s\n' "${TAGS}" | head -n 1)"
          docker buildx imagetools inspect "${PRIMARY_TAG}"

  release:
    name: Publish Git Tag & GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - binaries
      - binaries-macos
      - docker
    if: needs.prepare.outputs.should_publish == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog notes for version
        id: notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          : > release_notes.md
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="${VERSION}" '
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]:[[:space:]]+https?:\/\// { exit }
              found { lines[++n] = $0 }
              END {
                start = 1
                while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
                end = n
                while (end >= start && (lines[end] ~ /^[[:space:]]*$/ || lines[end] ~ /^---+[[:space:]]*$/)) end--
                for (i = start; i <= end; i++) print lines[i]
              }
            ' CHANGELOG.md > release_notes.md
          fi
          if [[ -s release_notes.md ]]; then
            echo "body_path=release_notes.md" >> "$GITHUB_OUTPUT"
            cat release_notes.md
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release binary archives
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          ARCHIVES=(*.tar.gz)
          if [[ "${#ARCHIVES[@]}" -ne 4 ]]; then
            echo "::error::Expected 4 release binary archives, found ${#ARCHIVES[@]}: ${ARCHIVES[*]}"
            exit 1
          fi
          sha256sum -- *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create and push annotated Git release tag
        if: needs.prepare.outputs.needs_tag_push == 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag -a "${TAG}" "${COMMIT_SHA}" -m "FeedCourier ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FeedCourier ${{ needs.prepare.outputs.tag }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
