name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-dist:
    name: Build Embedded WebUI Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --dir web exec tsc --noEmit

      - name: Build production WebUI bundle
        run: pnpm --dir web build

      - name: Upload compiled WebUI dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  binaries:
    name: Release Binary (${{ matrix.target }})
    needs: web-dist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and verify package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${CARGO_VERSION}" != "${TAG_VERSION}" ]]; then
              echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match git tag (${GITHUB_REF_NAME})"
              exit 1
            fi
            VERSION="${TAG_VERSION}"
          else
            VERSION="${CARGO_VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake pkg-config

      - name: Download compiled WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build locked release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            export MACOSX_DEPLOYMENT_TARGET="11.0"
            if [[ "${TARGET}" == "x86_64-apple-darwin" ]]; then
              export CMAKE_OSX_ARCHITECTURES="x86_64"
            elif [[ "${TARGET}" == "aarch64-apple-darwin" ]]; then
              export CMAKE_OSX_ARCHITECTURES="arm64"
            fi
          fi
          cargo build --release --locked --target "${TARGET}"

      - name: Strip and package release archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          BIN_PATH="target/${TARGET}/release/feedcourier"
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            strip -x "${BIN_PATH}"
          else
            strip "${BIN_PATH}"
          fi

          STAGE_DIR="$(mktemp -d)"
          cp "${BIN_PATH}" "${STAGE_DIR}/feedcourier"
          chmod 0755 "${STAGE_DIR}/feedcourier"
          cp LICENSE README.md README.zh-CN.md "${STAGE_DIR}/"

          ARCHIVE="feedcourier-${VERSION}-${TARGET}.tar.gz"
          tar -czf "${ARCHIVE}" -C "${STAGE_DIR}" feedcourier LICENSE README.md README.zh-CN.md
          rm -rf "${STAGE_DIR}"

      - name: Upload binary archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: feedcourier-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  docker:
    name: Multi-Arch Container Images (GHCR & Docker Hub)
    runs-on: ubuntu-latest
    needs: web-dist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve target container image repositories
        id: registries
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO_OVERRIDE: ${{ vars.DOCKERHUB_REPO }}
        run: |
          set -euo pipefail
          GH_REPO_LOWER="$(printf '%s' "${GH_REPO}" | tr '[:upper:]' '[:lower:]')"
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
            if [ -n "${DOCKERHUB_REPO_OVERRIDE}" ]; then
              RAW_DH_IMAGE="${DOCKERHUB_REPO_OVERRIDE}"
            else
              RAW_DH_IMAGE="${DOCKERHUB_USERNAME}/feedcourier"
            fi
            DH_IMAGE="$(printf '%s' "${RAW_DH_IMAGE}" | tr '[:upper:]' '[:lower:]')"
            {
              echo "images<<EOF"
              echo "ghcr.io/${GH_REPO_LOWER}"
              echo "${DH_IMAGE}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "images<<EOF"
              echo "ghcr.io/${GH_REPO_LOWER}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.registries.outputs.dockerhub_enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract OCI metadata and semantic version tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) }}
            type=sha

      - name: Build and push multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - binaries
      - docker
    steps:
      - name: Download release binary archives
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts

      - name: Generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -- *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
