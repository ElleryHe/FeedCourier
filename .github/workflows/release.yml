name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-dist:
    name: Build Embedded WebUI Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --dir web exec tsc --noEmit

      - name: Build production WebUI bundle
        run: pnpm --dir web build

      - name: Upload compiled WebUI dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  binaries:
    name: Release Binary (${{ matrix.target }})
    needs: web-dist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and verify package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${CARGO_VERSION}" != "${TAG_VERSION}" ]]; then
              echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match git tag (${GITHUB_REF_NAME})"
              exit 1
            fi
            VERSION="${TAG_VERSION}"
          else
            VERSION="${CARGO_VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake pkg-config

      - name: Download compiled WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build locked release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked --target "${TARGET}"

      - name: Strip and package release archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          BIN_PATH="target/${TARGET}/release/feedcourier"
          strip "${BIN_PATH}"

          STAGE_DIR="$(mktemp -d)"
          cp "${BIN_PATH}" "${STAGE_DIR}/feedcourier"
          chmod 0755 "${STAGE_DIR}/feedcourier"
          cp LICENSE README.md README.zh-CN.md "${STAGE_DIR}/"

          ARCHIVE="feedcourier-${VERSION}-${TARGET}.tar.gz"
          tar -czf "${ARCHIVE}" -C "${STAGE_DIR}" feedcourier LICENSE README.md README.zh-CN.md
          rm -rf "${STAGE_DIR}"

      - name: Upload binary archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: feedcourier-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  binaries-macos:
    name: Release Binaries (macOS arm64 & x86_64)
    needs: web-dist
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and verify package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${CARGO_VERSION}" != "${TAG_VERSION}" ]]; then
              echo "::error::Cargo.toml version (${CARGO_VERSION}) does not match git tag (${GITHUB_REF_NAME})"
              exit 1
            fi
            VERSION="${TAG_VERSION}"
          else
            VERSION="${CARGO_VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download compiled WebUI dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: apple-darwin

      - name: Build, strip, and package macOS release archives
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          for TARGET in aarch64-apple-darwin x86_64-apple-darwin; do
            if [[ "${TARGET}" == "aarch64-apple-darwin" ]]; then
              export CMAKE_OSX_ARCHITECTURES="arm64"
            else
              export CMAKE_OSX_ARCHITECTURES="x86_64"
            fi

            cargo build --release --locked --target "${TARGET}"

            BIN_PATH="target/${TARGET}/release/feedcourier"
            strip -x "${BIN_PATH}"

            STAGE_DIR="$(mktemp -d)"
            cp "${BIN_PATH}" "${STAGE_DIR}/feedcourier"
            chmod 0755 "${STAGE_DIR}/feedcourier"
            cp LICENSE README.md README.zh-CN.md "${STAGE_DIR}/"

            ARCHIVE="feedcourier-${VERSION}-${TARGET}.tar.gz"
            tar -czf "${ARCHIVE}" -C "${STAGE_DIR}" feedcourier LICENSE README.md README.zh-CN.md
            rm -rf "${STAGE_DIR}"
          done

      - name: Upload macOS arm64 binary archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-aarch64-apple-darwin
          path: feedcourier-${{ steps.version.outputs.version }}-aarch64-apple-darwin.tar.gz
          if-no-files-found: error

      - name: Upload macOS x86_64 binary archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-x86_64-apple-darwin
          path: feedcourier-${{ steps.version.outputs.version }}-x86_64-apple-darwin.tar.gz
          if-no-files-found: error

  docker:
    name: Multi-Arch Container Images (Docker Hub)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: web-dist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve target container image repository
        id: registries
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPO_OVERRIDE: ${{ vars.DOCKERHUB_REPO }}
        run: |
          set -euo pipefail
          if [[ -z "${DOCKERHUB_USERNAME}" ]] || [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets must be configured to publish Docker Hub images."
            exit 1
          fi
          RAW_DH_IMAGE="${DOCKERHUB_REPO_OVERRIDE:-${DOCKERHUB_USERNAME}/feedcourier}"
          DH_IMAGE="$(printf '%s' "${RAW_DH_IMAGE}" | tr '[:upper:]' '[:lower:]')"
          echo "image=${DH_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract OCI metadata and semantic version tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and push multi-arch container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync Docker Hub description and README
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.registries.outputs.image }}
          short-description: Lightweight pure-Rust RSS/Atom/JSON Feed delivery gateway with SMTP, Telegram, Notion & MCP
          readme-filepath: ./README.md

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - binaries
      - binaries-macos
      - docker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract changelog notes for tag
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          : > release_notes.md
          if [[ -f CHANGELOG.md ]]; then
            awk -v ver="${VERSION}" '
              index($0, "## [" ver "]") == 1 { found=1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]:[[:space:]]+https?:\/\// { exit }
              found { lines[++n] = $0 }
              END {
                start = 1
                while (start <= n && lines[start] ~ /^[[:space:]]*$/) start++
                end = n
                while (end >= start && (lines[end] ~ /^[[:space:]]*$/ || lines[end] ~ /^---+[[:space:]]*$/)) end--
                for (i = start; i <= end; i++) print lines[i]
              }
            ' CHANGELOG.md > release_notes.md
          fi
          if [[ -s release_notes.md ]]; then
            echo "body_path=release_notes.md" >> "$GITHUB_OUTPUT"
            cat release_notes.md
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release binary archives
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          shopt -s nullglob
          ARCHIVES=(*.tar.gz)
          if [[ "${#ARCHIVES[@]}" -ne 4 ]]; then
            echo "::error::Expected 4 release binary archives, found ${#ARCHIVES[@]}: ${ARCHIVES[*]}"
            exit 1
          fi
          sha256sum -- *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FeedCourier ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS.txt
