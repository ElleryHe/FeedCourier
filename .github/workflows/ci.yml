name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: WebUI (TypeScript & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --dir web exec tsc --noEmit

      - name: Build production WebUI bundle
        run: pnpm --dir web build

      - name: Upload compiled WebUI dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  rust:
    name: Rust Gateway (fmt, clippy, test, release)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake pkg-config

      - name: Download compiled WebUI dist
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --all-targets

      - name: Build locked release binary
        run: cargo build --release --locked

  license-audit:
    name: License & Supply-Chain Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: licenses bans sources

  docs:
    name: Docs Site (VitePress & Links)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install docs dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Build VitePress documentation site
        run: pnpm --dir docs build

  docker-web-stage:
    name: Dockerfile & Entrypoint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint docker-entrypoint.sh with ShellCheck
        run: shellcheck docker-entrypoint.sh

      - name: Verify entrypoint privilege drop on root-owned bind mount
        run: |
          HOST_DATA="$(mktemp -d)"
          sudo chown 0:0 "${HOST_DATA}"
          sudo chmod 0755 "${HOST_DATA}"
          docker run --rm \
            -v "${PWD}/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro" \
            -v "${HOST_DATA}:/data" \
            debian:bookworm-slim sh -eu -c '
              groupadd --gid 10001 feedcourier
              useradd --uid 10001 --gid feedcourier --home-dir /data --no-create-home --no-log-init --shell /usr/sbin/nologin feedcourier
              printf "#!/bin/sh\nset -eu\n[ \"\$(id -u):\$(id -g)\" = \"10001:10001\" ]\ntouch /data/probe\n" > /usr/local/bin/feedcourier
              chmod 0755 /usr/local/bin/feedcourier
              exec /usr/local/bin/docker-entrypoint.sh
            '
          test "$(stat -c '%u:%g' "${HOST_DATA}/probe")" = "10001:10001"
          sudo rm -rf "${HOST_DATA}"

      - name: Verify Dockerfile web-builder and cargo-recipe stages
        run: |
          docker build --target web-builder -t feedcourier-web-builder:ci .
          docker build --target cargo-recipe -t feedcourier-cargo-recipe:ci .
          docker run --rm feedcourier-cargo-recipe:ci sh -eu -c '
            grep -q "^version = \"0.0.0\"$" /recipe/Cargo.toml
            awk "/^name = \"feedcourier\"\$/{f=1;next} f && /^version = /{exit (\$0 != \"version = \\\"0.0.0\\\"\")}" /recipe/Cargo.lock
          '
