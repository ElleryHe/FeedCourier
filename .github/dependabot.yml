version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Ignore odd-numbered non-LTS Node.js majors (Docker uses Bundler version syntax)
      - dependency-name: "node"
        versions:
          - "~> 25.0"
          - "~> 27.0"
          - "~> 29.0"
