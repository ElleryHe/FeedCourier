changelog:
  exclude:
    labels:
      - ignore-for-release
      - skip-changelog
      - duplicate
      - invalid
      - wontfix
    authors:
      - dependabot
  categories:
    - title: Breaking Changes
      labels:
        - breaking-change
        - breaking
    - title: Security
      labels:
        - security
    - title: Features
      labels:
        - enhancement
        - feature
        - feat
    - title: Fixes
      labels:
        - bug
        - fix
        - bugfix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Maintenance & Dependencies
      labels:
        - chore
        - maintenance
        - dependencies
        - refactor
        - ci
        - "*"
